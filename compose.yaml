services:
  goodenough-postgres:
    container_name: goodenough-postgres
    env_file:
      - .env
      - .env.local
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: postgres:18
    ports:
      - 5432:5432
    restart: always
    volumes:
      - goodenough-postgres:/var/lib/postgresql

      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

volumes:
  goodenough-postgres:
