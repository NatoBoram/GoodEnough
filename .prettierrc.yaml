arrowParens: avoid
overrides:
  - files: '*.svelte'
    options:
      parser: 'svelte'
  - files: '*.sql'
    options:
      parser: 'postgresql'
plugins:
  - 'prettier-plugin-sql-cst'
  - 'prettier-plugin-svelte'
  - 'prettier-plugin-tailwindcss'
printWidth: 100
semi: false
singleQuote: true
sqlFunctionCase: lower
sqlIdentifierCase: lower
sqlKeywordCase: lower
sqlLiteralCase: lower
sqlTypeCase: lower
tailwindStylesheet: './src/routes/layout.css'
trailingComma: all
useTabs: true
