version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: America/Toronto
    commit-message:
      prefix: '⬆️ '
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      patch-development:
        update-types:
          - patch
        dependency-type: development
      patch-production:
        update-types:
          - patch
        dependency-type: production
      minor-development:
        update-types:
          - minor
        dependency-type: development
      minor-production:
        update-types:
          - minor
        dependency-type: production
      eslint:
        patterns:
          - '*eslint*'
          - globals
          - jiti
      tailwindcss:
        patterns:
          - '*heroicons*'
          - '*tailwindcss*'
          - postcss
      prettier:
        patterns:
          - '*prettier*'
      storybook:
        patterns:
          - '*react*'
          - '*storybook*'
      svelte:
        patterns:
          - '*svelte*'
      vite:
        patterns:
          - '*vitejs*'
          - vite
      typescript:
        patterns:
          - '*typescript*'
          - tsx

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Toronto
    commit-message:
      prefix: '⬆️ '
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      actions:
        patterns:
          - actions/*
      docker:
        patterns:
          - docker/*

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      timezone: America/Toronto
    commit-message:
      prefix: '⬆️ '
