<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%" class="scheme-light-dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<script>
			document.documentElement.classList.remove('scheme-light-dark')
			switch (localStorage?.getItem('theme')) {
				case 'light':
					document.documentElement.classList.remove('scheme-dark')
					document.documentElement.classList.add('scheme-light')
					break

				case 'dark':
				default:
					document.documentElement.classList.remove('scheme-light')
					document.documentElement.classList.add('scheme-dark')
					break
			}
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" class="bg-bg-page text-text-primary">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
